# Coleta do Nexus a cada 3 horas. A Vercel gratuita só permite 1 cron por dia
# (vercel.json, 09:00 UTC); este agendamento grátis do GitHub chama a mesma rota
# nos outros horários. Precisa do segredo CRON_SECRET no repositório (mesmo
# valor da variável CRON_SECRET da Vercel).
name: Coleta do Nexus

on:
  schedule:
    - cron: '0 0,3,6,12,15,18,21 * * *' # 09:00 UTC já é da Vercel
  workflow_dispatch: {}

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Chamar a coleta
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "Falta o segredo CRON_SECRET no repositório"; exit 1; fi
          curl -fsS --max-time 320 -H "Authorization: Bearer $CRON_SECRET" \
            https://axioma-app.vercel.app/api/nexus/ingest/bcb -o resposta.json
          head -c 1500 resposta.json
